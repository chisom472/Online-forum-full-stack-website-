<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Digital Enviro</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/icon-square.png" alt="Digital Enviro logo">
      <span class="brand-word">DIGITAL <span>ENVIRO</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="forum.html">Forum</a></li>
      <li><a href="blog.html">Blog</a></li>
    </ul>
    <div class="nav-actions" id="nav-auth-slot"></div>
  </div>
</header>

<section class="section container">
  <div class="form-card">
    <div style="text-align:center; margin-bottom:24px;">
      <img src="assets/icon-square.png" alt="" style="height:48px; margin:0 auto 12px;">
      <h1 style="font-size:1.4rem;">Reset your password</h1>
      <p style="font-size:0.9rem;">Enter the email on your account and we'll send you a reset link.</p>
    </div>

    <div class="form-error" id="form-error"></div>
    <div class="form-success" id="form-success"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Send reset link</button>
    </form>

    <p style="text-align:center; font-size:0.88rem; margin-top:20px;">
      Remembered it? <a href="login.html" style="color:var(--leaf-deep); font-weight:600;">Log in</a>
    </p>
  </div>
</section>

<script src="api.js"></script>
<script src="main.js"></script>
<script src="forgot-password.js"></script>
</body>
  </html>
