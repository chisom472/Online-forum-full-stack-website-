<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Stats — Digital Enviro</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="section container">
  <div class="form-card">
    <h1 style="font-size:1.4rem; text-align:center;">Site stats</h1>
    <div class="form-error" id="form-error"></div>
    <div id="stats" style="text-align:center; font-size:1.1rem; line-height:2;">Loading…</div>
    <p style="text-align:center; font-size:0.88rem; margin-top:20px;">
      <a href="index.html" style="color:var(--leaf-deep); font-weight:600;">Back to site</a>
    </p>
  </div>
</section>

<script src="api.js"></script>
<script>
(async () => {
  const statsEl = document.getElementById('stats');
  const errorEl = document.getElementById('form-error');
  if (!Auth.isLoggedIn()) {
    statsEl.textContent = '';
    errorEl.textContent = 'Please log in with your admin account first.';
    errorEl.style.display = 'block';
    return;
  }
  try {
    const s = await apiRequest('/users/admin/stats');
    statsEl.innerHTML = `<b>${s.users}</b> users<br><b>${s.posts}</b> posts<br><b>${s.comments}</b> comments`;
  } catch (err) {
    statsEl.textContent = '';
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
})();
</script>
</body>
</html>
